[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zed-launcher"
version = "0.1.0"
description = "A lightweight game launcher for Linux, built for NixOS"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "icoextract>=0.2",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "uvicorn>=0.30",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
zed-launcher = "zed_launcher.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zed_launcher"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
